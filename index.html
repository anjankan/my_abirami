<!doctype html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#1f6f5c">
<title>Abirami Store · குரல் பில்</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans Tamil","Nirmala UI",system-ui,sans-serif;background:#f4f1ea;color:#1d1d1d;font-size:17px}
header{background:#1f6f5c;color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5;flex-wrap:wrap;gap:6px}
header h1{font-size:19px;margin:0}
header .hb{display:flex;gap:4px;flex-wrap:wrap}
header button{background:none;border:1px solid #ffffff99;color:#fff;border-radius:8px;padding:6px 9px;font-size:14px;font-family:inherit}
header button.lang{background:#ffffff22;font-weight:700}
main{padding:12px;max-width:560px;margin:0 auto 40px}
.board{text-align:center;margin-bottom:10px}
.board img{max-width:100%;max-height:170px;border-radius:12px;box-shadow:0 1px 6px #0002}
#todayBar{font-size:15px;color:#1f6f5c;font-weight:600;margin:0 0 8px;text-align:center}
#mic{width:100%;padding:24px 10px;border:0;border-radius:18px;background:#1f6f5c;color:#fff;font-size:22px;font-weight:600;box-shadow:0 3px 0 #164f41;font-family:inherit}
#mic.on{background:#c0392b;box-shadow:0 3px 0 #8e2a20;animation:pulse 1s infinite}
#mic:disabled{background:#999;box-shadow:none}
#mic:active{transform:translateY(2px)}
@keyframes pulse{50%{opacity:.7}}
#status{min-height:46px;padding:10px 4px;color:#444;font-size:16px}
#status.err{color:#b00020}
#card{display:none;background:#fff;border-radius:16px;padding:14px;text-align:center;margin:6px 0 14px;box-shadow:0 1px 6px #0001}
#cardPic{height:130px;display:flex;align-items:center;justify-content:center;font-size:96px}
#cardPic img{max-height:130px;max-width:100%;border-radius:12px;object-fit:cover}
#cardName{font-size:22px;font-weight:700;margin-top:6px}
#cardQty{font-size:18px;color:#555;margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0 16px}
.tile{background:#fff;border:0;border-radius:14px;padding:6px 2px 8px;text-align:center;font-size:14px;box-shadow:0 1px 3px #0001;color:#222;font-family:inherit}
.tile:active{background:#e4f0ec}
.tile small{color:#777;font-size:11px}
.pic{display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:34px}
.tile .pic{height:50px}
.tile .pic img{max-height:50px;max-width:100%;border-radius:8px;object-fit:cover}
h2{font-size:16px;margin:14px 0 6px;color:#555}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 3px #0001}
td,th{padding:8px 6px;border-bottom:1px solid #eee;text-align:left;vertical-align:middle}
th{font-size:13px;color:#777;font-weight:600}
td.pc{width:50px;font-size:28px;padding-right:0}
td.pc img{width:44px;height:44px;object-fit:cover;border-radius:8px}
td small{color:#777}
.r{text-align:right;white-space:nowrap}
.qc{white-space:nowrap}
.qb{border:1px solid #bbb;background:#fff;border-radius:8px;width:30px;height:30px;font-size:18px;padding:0}
.qv{display:inline-block;min-width:64px;text-align:center;font-size:15px}
.qin{width:74px;font-size:15px;text-align:center;padding:4px;border:1px solid #bbb;border-radius:8px;font-family:inherit}
.qu{font-size:14px;color:#555}
.x{border:0;background:none;color:#c0392b;font-size:18px;padding:4px}
.total{display:flex;justify-content:space-between;align-items:center;background:#1f6f5c;color:#fff;border-radius:14px;padding:14px 16px;margin-top:12px;font-size:22px;font-weight:700}
.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.actions button{padding:13px 4px;border:0;border-radius:12px;font-size:15px;font-weight:600;background:#fff;box-shadow:0 1px 3px #0002;font-family:inherit}
.actions .pri{background:#e8a317;color:#222}
#manual{display:flex;gap:8px;margin-top:14px}
#manual input{flex:1;min-width:0;padding:12px;font-size:16px;border:1px solid #ccc;border-radius:12px;font-family:inherit}
#manual button{padding:12px 16px;border:0;border-radius:12px;background:#1f6f5c;color:#fff;font-size:16px;font-family:inherit}
#custPhone{width:100%;padding:11px;font-size:16px;border:1px solid #ccc;border-radius:12px;font-family:inherit;background:#fff;margin-bottom:6px}
.empty{color:#888;text-align:center;padding:18px;background:#fff;border-radius:14px}
dialog{border:0;border-radius:16px;padding:16px;width:min(94vw,460px);font-family:inherit;max-height:90vh;overflow:auto}
dialog::backdrop{background:#0006}
dialog h3{margin:8px 0 8px}
dialog input,dialog select,dialog textarea{width:100%;padding:10px;font-size:16px;margin:4px 0 10px;border:1px solid #ccc;border-radius:10px;font-family:inherit}
dialog textarea{min-height:110px;resize:vertical}
.row{display:flex;gap:8px}
.row>*{flex:1}
.btn{padding:12px;border:0;border-radius:12px;background:#1f6f5c;color:#fff;font-size:16px;font-family:inherit}
.btn.alt{background:#eee;color:#222}
.item-edit{background:#f7f7f4;border-radius:12px;padding:8px;margin-bottom:8px;display:flex;gap:8px;align-items:center}
.item-edit .ph{width:52px;height:52px;font-size:32px;flex:none;background:#fff;border-radius:10px}
.item-edit .ph img{width:52px;height:52px;object-fit:cover;border-radius:10px}
.item-edit .info{flex:1;font-size:15px}
.item-edit .info small{color:#777}
.pin{width:78px!important;margin:0!important;padding:6px!important}
.hrow{padding:12px;border-bottom:1px solid #eee;font-size:16px;cursor:pointer}
.hrow:active{background:#eef6f3}
.bh{text-align:center;margin-bottom:8px;font-size:16px}
.bh div{color:#666;font-size:13px}
.bt{box-shadow:none;border:1px solid #ddd}
.bt th,.bt td{font-size:14px}
.bt .tt td{font-weight:700;border-bottom:0}
.foot{text-align:center;margin-top:10px;color:#666;font-size:14px}
.hint{font-size:13px;color:#777;margin:0 0 6px}
.rc{font-family:"Courier New",Courier,monospace;font-size:13px;line-height:1.35;background:#fff;color:#000;margin:0;padding:8px 4px;white-space:pre;overflow-x:auto;text-align:left}
dialog .rc{font-size:14px}
.item-edit.off{opacity:.55}
.onoff{display:flex;flex-direction:column;align-items:center;font-size:12px;color:#555;flex:none}
dialog input[type=checkbox]{width:22px;height:22px;margin:2px 0 0;padding:0}
#printArea{display:none}
@media print{
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{display:block;position:absolute;left:0;top:0;width:100%;padding:10px;font-size:13px;color:#000;background:#fff}
  #printArea table{box-shadow:none;border:1px solid #000}
  #printArea th,#printArea td{border-bottom:1px solid #999;color:#000}
}
</style>
</head>
<body>

<header>
  <h1 id="shopTitle"></h1>
  <div class="hb">
    <button id="btnLang" class="lang"></button>
    <button id="btnItems" data-i18n="items"></button>
    <button id="btnDays" data-i18n="dayBtn"></button>
    <button id="btnHist" data-i18n="hist"></button>
  </div>
</header>

<main>
  <!-- Write your comments here -->
  <!---- <div class="board"><img src="abirami-board.png" alt="Abirami Store" onerror="this.parentNode.style.display='none'"></div> -->

  <div id="todayBar"></div>
  <button id="mic"></button>
  <div id="status"></div>

  <div id="card">
    <div id="cardPic"></div>
    <div id="cardName"></div>
    <div id="cardQty"></div>
  </div>

  <div class="grid" id="grid"></div>

  <form id="manual" autocomplete="off">
    <input id="typed" data-ph="typePh">
    <button type="submit" data-i18n="add"></button>
  </form>

  <h2 data-i18n="cartTitle"></h2>
  <input id="custPhone" type="tel" inputmode="tel" autocomplete="off" data-ph="custPh">
  <div id="lines"></div>
  <div class="total"><span data-i18n="total"></span><span id="total">₹0</span></div>

  <div class="actions">
    <button id="btnClear" data-i18n="clear"></button>
    <button id="btnShare" data-i18n="draft"></button>
    <button class="pri" id="btnBill" data-i18n="bill"></button>
  </div>
</main>

<!-- Items, prices and daily price update -->
<dialog id="itemsDlg">
  <h3 data-i18n="itemsTitle"></h3>
  <label data-i18n="shopPhoneLabel"></label>
  <input id="shopPhone" inputmode="tel">
  <div id="itemsList"></div>

  <h3 data-i18n="updateTitle"></h3>
  <p class="hint" data-i18n="updateHint"></p>
  <textarea id="priceIn" data-ph="updatePh"></textarea>
  <button class="btn" id="applyPrices" style="width:100%" data-i18n="updateBtn"></button>

  <div id="heardList"></div>

  <h3 data-i18n="newItem"></h3>
  <input id="nTa" data-ph="nameTa">
  <input id="nEn" data-ph="nameEn">
  <input id="nAlias" data-ph="alias">
  <div class="row">
    <input id="nPrice" type="number" min="0" step="0.5" data-ph="price">
    <select id="nUnit"></select>
  </div>
  <input id="nEmoji" data-ph="emojiPh">
  <div class="row">
    <button class="btn" id="addItem" data-i18n="save"></button>
    <button class="btn alt" id="closeItems" data-i18n="close"></button>
  </div>
  <input id="photoIn" type="file" accept="image/*" hidden>
</dialog>

<!-- Day-wise summary -->
<dialog id="daysDlg">
  <h3 data-i18n="daysTitle"></h3>
  <div id="daysList"></div>
  <div id="dayView"></div>
  <div class="row" style="margin-top:10px"><button class="btn alt" id="closeDays" data-i18n="close"></button></div>
</dialog>

<!-- Bill history -->
<dialog id="histDlg">
  <h3 data-i18n="histTitle"></h3>
  <div id="histList"></div>
  <div class="row" style="margin-top:10px"><button class="btn alt" id="closeHist" data-i18n="close"></button></div>
</dialog>

<!-- Bill view -->
<dialog id="billDlg">
  <div id="billBody"></div>
  <div class="row" style="margin-top:12px">
    <button class="btn" id="billPrint" data-i18n="print"></button>
    <button class="btn" id="billShare" data-i18n="whatsapp"></button>
    <button class="btn alt" id="billClose" data-i18n="close"></button>
  </div>
</dialog>

<div id="printArea"></div>

/* ================= VOICE / TEXT PARSING ================= */
function aliasList(){
  const out = [];
  for(const it of items){
    if(it.active === false) continue;
    for(const a of [it.ta, it.en, ...(it.alias || [])]){
      const n = norm(a || '');
      if(n) out.push({a:n, item:it});
    }
  }
  return out.sort((x, y) => y.a.length - x.a.length);   // longest first
}

function findMatches(t, list){
  const used = new Array(t.length).fill(false);
  const hits = [];
  for(const {a, item} of list){
    const latin = /^[a-z0-9 ]+$/.test(a);
    let i = t.indexOf(a);
    while(i !== -1){
      const end = i + a.length;
      // English words must stand alone (optionally with a plural 's'); Tamil allows suffixes
      const bEnd = end === t.length || t[end] === ' ' || (t[end] === 's' && (end + 1 === t.length || t[end + 1] === ' '));
      let free = !latin || ((i === 0 || t[i-1] === ' ') && bEnd);
      if(free) for(let k = i; k < end; k++) if(used[k]){ free = false; break; }
      if(free){
        for(let k = i; k < end; k++) used[k] = true;
        hits.push({item, start:i, end});
      }
      i = t.indexOf(a, i + 1);
    }
  }
  return hits.sort((x, y) => x.start - y.start);
}

function parseQty(seg){
  let qty = null, gram = false;
  const toks = [];
  for(const raw of seg.split(' ')){
    if(!raw) continue;
    // split "300gms" / "300கிராம்" into number + unit, and "twenty-six" into two words
    const m = raw.match(/^(\d+(?:\.\d+)?)(.*)$/);
    toks.push(...(m ? [m[1], m[2]].filter(Boolean) : raw.split('-').filter(Boolean)));
  }
  for(let i = 0; i < toks.length; i++){
    const tok = toks[i];
    if(isGram(tok)) gram = true;
    if(qty === null){
      if(/^\d+(\.\d+)?$/.test(tok)) qty = parseFloat(tok);
      else if(WORDS[tok] !== undefined){
        qty = WORDS[tok];
        // tens + unit: "twenty six", "இருபது ஆறு" = 26
        const nx = toks[i + 1];
        if(qty >= 20 && qty < 100 && qty % 10 === 0 && nx && Number.isInteger(WORDS[nx]) && WORDS[nx] >= 1 && WORDS[nx] <= 9){
          qty += WORDS[nx]; i++;
        }
      }
    }
  }
  return {qty, gram};
}
  

// Longest run of consecutive digits (as numerals or spoken digit words)
function bestDigitRun(tokens){
  let best = '', cur = '';
  for(const x of tokens){
    let d = null;
    if(/^\d+$/.test(x)) d = x;
    else if(DIGIT_WORDS[x] !== undefined) d = String(DIGIT_WORDS[x]);
    if(d !== null){ cur += d; if(cur.length > best.length) best = cur; }
    else cur = '';
  }
  return best;
}
function normPhone(d){
  d = String(d).replace(/\D/g, '');
  if(d.length === 12 && d.startsWith('91')) d = d.slice(2);
  if(d.length === 11 && d.startsWith('0')) d = d.slice(1);
  return d;
}

// Turns one utterance (Tamil or English) into item hits, an optional command and an optional customer number.
// Convention: say the item name first, then its quantity ("tomato two kilo" / "தக்காளி இரண்டு கிலோ").
function analyze(raw){
  const t = norm(raw);
  const tok = t.split(' ');
  let cmd = null;
  if(hasAny(tok, ['பில்','பில்போடு','bill'])) cmd = 'bill';
  else if(hasAny(tok, ['அழி','clear'])) cmd = 'clear';
  else if(hasAny(tok, ['நீக்கு','undo'])) cmd = 'undo';

  const hits = findMatches(t, aliasList());
  const out = hits.map((h, i) => {
    const after  = t.slice(h.end, i + 1 < hits.length ? hits[i+1].start : t.length);
    const before = i === 0 ? t.slice(0, h.start) : '';
    let q = parseQty(after);
    if(q.qty === null) q = parseQty(before);
    const heard = q.qty !== null;
    const qty = heard ? q.qty : 1;
    let uom = h.item.unit;
    if(h.item.unit === 'kg'){
      if(q.gram) uom = 'g';
      else if(heard && qty >= 50 && Number.isInteger(qty)) uom = 'g';   // "500" for tomato = 500 g
    }
    return {item:h.item, qty, uom, heard};
  });

  // Customer WhatsApp number: needs a keyword ("number", "வாடிக்கையாளர்"...) or be spoken alone
  const run = bestDigitRun(tok);
  const cand = normPhone(run);
  const hasKey = hasAny(tok, PHONE_KEYS);
  let phone = null, phoneBad = false;
  if(cand.length === 10 && (hasKey || hits.length === 0)) phone = cand;
  else if(hasKey && run.length >= 4) phoneBad = true;

  return {hits:out, cmd, phone, phoneBad};
}

const HEARD_KEY = 'tb.heard.v1';
function getHeard(){ try{ return JSON.parse(localStorage.getItem(HEARD_KEY)) || []; }catch(e){ return []; } }

// keep only the item words: drop numbers, quantity words and unit words, so "மோரிஸ் 500" is saved as "மோரிஸ்"
const UNIT_WORDS = ['கிலோ','kilo','kilos','kg','கிராம்','gram','grams','gm','gms','g','பாக்கெட்','packet','packets','litre','லிட்டர்','pcs','piece','pieces','எண்ணிக்கை'];
function cleanPhrase(text){
  return norm(text || '').split(' ').filter(w => w && !/^\d+(\.\d+)?$/.test(w) && WORDS[w] === undefined && !UNIT_WORDS.includes(w) && !isGram(w)).join(' ');
}
function rememberHeard(text){
  const t = cleanPhrase(text);
  if(!t) return;
  setHeard([t, ...getHeard().filter(x => x !== t)].slice(0, 15));
}

function handleInput(alts){
  let chosen = null;
  for(const a of alts){
    const r = analyze(a);
    if(r.hits.length || r.cmd || r.phone || r.phoneBad){ chosen = r; break; }
  }
  if(!chosen){
    rememberHeard(alts[0]);
    setStatus(T('notUnderstood', {t: alts[0]}), true);
    return;
  }
  apply(chosen);
}

function apply(r){
  for(const h of r.hits) addLine(h.item, h.qty, h.uom);
  const parts = [];

  if(r.hits.length){
    const lastHit = last(r.hits);
    showCard(lastHit.item, lastHit.qty, lastHit.uom);
    const msg = r.hits.map(h => `${nm(h.item)} ${fq(h.qty)} ${uomL(h.uom)}`).join(', ');
    const unheard = r.hits.some(h => !h.heard) ? ' ' + T('unheard') : '';
    parts.push(T('added', {msg}) + unheard);
    speak(T('spokenAdded', {msg}));
  }
  if(r.phone){
    cartPhone = r.phone;
    $('custPhone').value = fmtPhone(r.phone);
    parts.push(T('custSaved', {n: fmtPhone(r.phone)}));
  }
  if(r.phoneBad) parts.push(T('custInvalid'));
  if(r.cmd === 'undo'){
    if(cart.length){ const l = cart.pop(); parts.push(T('undone', {name: nm(itemById(l.itemId) || {})})); }
    else parts.push(T('noItems'));
  }
  if(r.cmd === 'clear'){
    if(cart.length && confirm(T('confirmClear'))){ cart = []; parts.push(T('cleared')); }
  }

  save(); renderCart();
  if(r.cmd === 'bill') finalizeBill();
  else if(parts.length) setStatus(parts.join(' · '), r.phoneBad && !r.hits.length);
}

/* ================= CART ================= */
function addLine(item, qty, uom){
  const ex = cart.find(l => l.itemId === item.id && l.uom === uom);
  if(ex) ex.qty = r2(ex.qty + qty);
  else cart.push({itemId:item.id, qty:r2(qty), uom});
  save(); renderCart();

  return cart.map(l => {
    const it = itemById(l.itemId);
    return {
      ta: it?.ta || '?', en: it?.en || '', rn: it?.rn || '',
      qty: l.qty, uom: l.uom,
      price: it?.price || 0,
      amount: r2m(calc(it, l))
    };
  });
}
const totalOf = lines => r2m(lines.reduce((s, l) => s + l.amount, 0));

  const box = $('lines');
  if(!cart.length){

  } else {

      return `<tr>

/* ================= DAY SUMMARY ================= */
const billsOnDay = k => bills.filter(b => dayKey(b.date) === k);
function summarize(list){
  const map = {}; let total = 0;
  for(const b of list){
    total += b.total;
    for(const l of b.lines){
      const key = (l.en || l.ta) + '|' + l.uom;
      const s = map[key] || (map[key] = {ta:l.ta, en:l.en, uom:l.uom, qty:0, amount:0});
      s.qty = r2(s.qty + l.qty);
      s.amount = r2m(s.amount + l.amount);
    }
  }
  return {count:list.length, total:r2m(total), items:Object.values(map).sort((a, b) => b.amount - a.amount)};
}
function renderToday(){

/* ================= RECEIPT (same layout as the shop's printed bill) ================= */
const RC = {
  W: 40,
  shop: 'ABIRAMI STORE',
  addr: ['6/47 perummal kovil street,', 'Rajankuppam,Chennai-95'],
  gst: 'GST No : 33BFGPN4893C1ZF',
  cashier: 'CASHIER1',
  billType: 'CASH BILL',
  footer: ['DOOR DELIVERY FREE', '8608687575', 'WHATSAPP/ GPAY NO', '9940016226/8667695433', 'Thank You !!!.Visit Again !!!.']
};
const rcCenter = s => ' '.repeat(Math.max(0, Math.floor((RC.W - s.length) / 2))) + s;
const rcRule = () => '-'.repeat(RC.W);
const rcLR = (l, r) => l + ' '.repeat(Math.max(1, RC.W - l.length - r.length)) + r;
const rcMoney = n => Number(n).toFixed(2);
const rcDate = d => {
  const x = new Date(d), h = x.getHours();
  return `${pad2(x.getDate())}/${pad2(x.getMonth() + 1)}/${x.getFullYear()} ${pad2(h % 12 || 12)}:${pad2(x.getMinutes())}:${h < 12 ? 'AM' : 'PM'}`;
};
const rcName = l => String(l.rn || l.en || l.ta || '?').toUpperCase();
const rcIsWeight = l => ['g', 'kg', 'litre'].includes(l.uom);
const rcQtyKg = l => l.uom === 'g' ? l.qty / 1000 : l.qty;
const rcQtyTxt = l => rcIsWeight(l) ? rcQtyKg(l).toFixed(3) : String(l.qty);

function receiptText(b, draft){
  const out = [];
  out.push(rcCenter(RC.shop));
  RC.addr.forEach(a => out.push(rcCenter(a)));
  out.push(rcCenter(shopPhone));
  out.push(rcCenter(RC.gst));
  out.push(rcRule());
  out.push(rcLR('BillNo : ' + (draft ? '-' : b.no), 'Date : ' + rcDate(b.date)));
  out.push(rcLR('Cashier : ' + RC.cashier, 'BillType : ' + RC.billType));
  if(b.phone) out.push('Customer : ' + fmtPhone(b.phone));
  out.push(rcRule());
  out.push('SNO DESCRIPTION');
  out.push('QTY'.padStart(17) + 'RATE'.padStart(10) + 'AMOUNT'.padStart(13));
  out.push(rcRule());
  b.lines.forEach((l, i) => {
    out.push(String(i + 1).padEnd(4) + rcName(l));
    out.push(rcQtyTxt(l).padStart(17) + rcMoney(l.price).padStart(10) + rcMoney(l.amount).padStart(13));
  });
  out.push(rcRule());
  const gross = b.total;
  const total = Math.round(gross);
  out.push('Gross Amount :'.padStart(27) + rcMoney(gross).padStart(13));
  out.push('Coinage :'.padStart(27) + rcMoney(total - gross).padStart(13));
  out.push('Total Amount :'.padStart(27) + rcMoney(total).padStart(13));
  out.push(rcRule());
  const qsum = b.lines.reduce((s, l) => s + (rcIsWeight(l) ? rcQtyKg(l) : l.qty), 0);
  out.push(rcLR('Total Items : ' + b.lines.length, 'Total Qty : ' + r2(qsum)));
  out.push(rcRule());
  RC.footer.forEach(f => out.push(rcCenter(f)));
  return out.join('\n');
}

function shrink(file){
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const s = Math.min(1, 240 / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', 0.8));
      };
      img.onerror = reject;
      img.src = fr.result;
    };
    fr.onerror = reject;
    fr.readAsDataURL(file);
  });
}

/* ================= MIC (Web Speech API) ================= */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const mic = $('mic');
let rec = null, listening = false;

function setMic(v){
  listening = v;
  mic.classList.toggle('on', v);
  mic.textContent = v ? T('micOn') : T('micIdle');
}

if(!window.isSecureContext){
  setStatus(lang === 'en' ? 'Open this app through its https:// link, not a file. Mic needs https.' : 'இந்த பக்கத்தை https:// இணைப்பின் மூலம் திறக்கவும். மைக்குக்கு https தேவை.', true);
}
if(SR){
  rec = new SR();
  rec.continuous = false;
  rec.interimResults = false;
  rec.maxAlternatives = 5;
  rec.onresult = e => {
    const res = e.results[0], alts = [];
    for(let i = 0; i < res.length; i++) alts.push(res[i].transcript);
    handleInput(alts);
  };
  rec.onerror = e => {
    if(e.error !== 'aborted') setStatus(I18N[lang].err[e.error] || (lang === 'en' ? 'Error: ' : 'பிழை: ') + e.error, true);
    setMic(false);
  };
  rec.onend = () => setMic(false);
  mic.onclick = () => {
    if(listening){ rec.stop(); return; }
    try{
      rec.lang = VOICE_LANG;
      rec.start(); setMic(true); setStatus(T('micStart'));
    }catch(e){ setStatus(T('retry') + ' [' + e.name + ']', true); }
  };
}
